spring.application.name=wallet

# DataSource
spring.datasource.url=jdbc:postgresql://localhost:5432/wallet
spring.datasource.username=postgres
spring.datasource.password=258097
spring.datasource.driver-class-name=org.postgresql.Driver

# Hikari — spec constraint
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=2000
spring.datasource.hikari.pool-name=WalletPool

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Tomcat — spec constraint
server.tomcat.threads.max=50

# Default port (override with -Dserver.port=8082 for second instance)
server.port=8081
